[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envsurgeon"
version = "0.1.0"
description = "Diagnose missing, unused, and leaked environment variables before they bite you."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "iamzulx" }]
keywords = ["cli", "env", "dotenv", "secrets", "devops", "ci"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
envsurgeon = "envsurgeon.cli:main"

[project.urls]
Homepage = "https://github.com/iamzulx/envsurgeon"
Issues = "https://github.com/iamzulx/envsurgeon/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/envsurgeon"]
